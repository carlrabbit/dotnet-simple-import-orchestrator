name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          dotnet build --no-restore

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          dotnet test --no-build --configuration Debug

      - name: Format check
        shell: bash
        run: |
          set -euo pipefail
          dotnet format --verify-no-changes
